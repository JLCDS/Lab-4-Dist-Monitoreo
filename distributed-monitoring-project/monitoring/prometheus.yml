global:
  scrape_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'flask_app'
    static_configs:
      - targets: ['app1:5000', 'app2:5000']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
